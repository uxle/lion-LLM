[package]
name    = "lion_core"
version = "0.9.0"
edition = "2021"

[dependencies]
rand     = { version = "0.8", features = ["small_rng"] }
rayon    = "1.10"
serde    = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode  = "1.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "lion_bench"
harness = false
