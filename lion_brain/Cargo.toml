[package]
name    = "lion_brain"
version = "1.0.0"
edition = "2021"

[dependencies]
lion_core  = { path = "../lion_core" }

# Async runtime
tokio    = { version = "1.0", features = ["full"] }

# HTTP client for Ollama
reqwest  = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

# Serialization
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"
bincode     = "1.3"

# Logging
tracing = "0.1"

# Error handling
anyhow = "1.0"
