[package]
name    = "lion_server"
version = "0.10.0"
edition = "2021"

[[bin]]
name = "lion_server"
path = "src/main.rs"

[dependencies]
lion_core = { path = "../lion_core" }

# Web framework
axum         = { version = "0.7",  features = ["ws"] }
tokio        = { version = "1.0",  features = ["full"] }
tower        = "0.4"
tower-http   = { version = "0.5",  features = ["cors", "trace", "fs"] }

# Serialization
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
toml         = "0.8"
bincode      = "1.3"

# CLI
clap         = { version = "4.0", features = ["derive"] }

# Logging
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async channels for WebSocket broadcasting
tokio-stream = "0.1"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
panic         = "abort"
